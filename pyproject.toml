[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-gitops"
version = "0.1.0"
description = "Git-driven Minecraft server configuration and deployment"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
gitcraft = "minecraft_gitops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
